<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apiaro Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .loader {
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e94560;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader p {
            color: #a0a0a0;
            font-size: 14px;
        }
        .error-fallback {
            display: none;
            text-align: center;
        }
        .error-fallback a {
            color: #e94560;
            text-decoration: none;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Checking authentication...</p>
    </div>

    <div class="error-fallback" id="errorFallback">
        <p>Something went wrong.</p>
        <a href="login.html">Go to Login</a>
    </div>

    <script>
        // IMMEDIATE execution — no delays
        (function() {
            try {
                const token = localStorage.getItem('admin_token');
                
                // If token exists and looks valid (not null, not empty, reasonable length)
                if (token && token !== 'null' && token !== 'undefined' && token.length > 20) {
                    // User is logged in → go to dashboard
                    window.location.replace('dashboard.html');
                } else {
                    // No token → clear any junk and go to login
                    localStorage.removeItem('admin_token');
                    localStorage.removeItem('admin_user');
                    window.location.replace('login.html');
                }
            } catch (e) {
                // If localStorage is blocked or JS errors, show manual link
                console.error('Auth check failed:', e);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('errorFallback').style.display = 'block';
            }
        })();
    </script>
</body>
</html>
